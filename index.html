<title>מינונים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&family=Secular+One&display=swap">
<style>
/* Layout: one full-screen canvas over a quiet living room, HUD strip on top, overlay cards for start / game over. Single deliberate dark-warm look. */
:root{
  --night:#24211d; --panel:#2f2b26; --ink:#f6f2ea; --muted:#bdb3a3;
  --teal:#57d6c2; --tealDark:#2a9283; --pill:#4cc3ff; --pill2:#ff8fc8; --ster:#ffc93c; --seize:#ff3b4a; --rx:#ffffff;
  --display:"Secular One","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important;}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body);}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;}
canvas{display:block;width:100%;flex:1;min-height:0;}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;direction:rtl;}
.score{font-family:var(--display);font-size:2rem;line-height:40px;height:40px;color:var(--teal);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #0008;}
.sub{font-size:.75rem;color:var(--muted);letter-spacing:.04em;margin-top:0;text-shadow:0 1px 0 #0008;}
.lives{font-size:1.4rem;letter-spacing:2px;height:40px;display:flex;align-items:center;}
.lives span{filter:drop-shadow(0 1px 2px #000c);}
.lives .lost{opacity:.45;}
#pause,#mute{display:grid;place-items:center;}
#pause,#mute{pointer-events:auto;background:#0b162680;border:1.5px solid #ffffff59;color:#fff;box-shadow:0 2px 6px #0006;border-radius:10px;width:40px;height:40px;font-size:1rem;cursor:pointer;}
#pauseMenu{background:#08111fcc;}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,#0e1d33ee,#08111ff2);direction:rtl;}
.card{max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto;padding:4px 4px 12px;box-sizing:border-box;}
h1{font-family:var(--body);font-weight:800;font-size:3.3rem;margin:0;line-height:1.05;text-wrap:balance;background:linear-gradient(180deg,#a8ffef 0%,#4fe3c6 55%,#22b89c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #0b5e50) drop-shadow(0 0 14px #3fe0c255);}
.tag{color:var(--muted);margin:0;line-height:1.5;}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:right;font-size:.88rem;}
.legend div{background:#ffffff0d;border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;}
.legend .wide{grid-column:span 2;}
.goal{margin:0;font-size:1.25rem;font-weight:800;color:#fff;text-wrap:balance;}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pills div{background:linear-gradient(180deg,#1b2b47,#121f35);border:1.5px solid #2c4166;border-radius:14px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:1rem;color:#fff;min-width:0;box-shadow:inset 0 1px 0 #ffffff14;}
.doses{display:flex;flex-direction:column;gap:6px;}
.doses h3{font-size:.8rem;color:var(--muted);letter-spacing:.06em;font-weight:600;}
.cap{display:block;width:58px;height:24px;border-radius:12px;margin-block:6px 2px;background:linear-gradient(180deg,#ffffff70 0 22%,transparent 22% 100%),linear-gradient(90deg,var(--c) 50%,#f2f6fb 50%);box-shadow:inset 0 -4px 0 #0000002a,0 6px 10px #0006;transform:rotate(-24deg);}
.cap.big{width:62px;height:26px;border-radius:13px;}
.pills b{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c);}
.rxrow{display:flex;gap:12px;align-items:center;text-align:right;background:linear-gradient(180deg,#123532,#0d2826);border:2px solid #3fd6b8;border-radius:16px;padding:12px 14px;font-size:1rem;line-height:1.5;color:#fff;}
.rxrow b{color:#5ff0d2;font-weight:800;}
.rxrow .chip{width:38px;height:38px;font-size:1.15rem;background:#fff!important;box-shadow:0 2px 6px #0006;}
.warn{display:flex;gap:12px;align-items:center;text-align:right;background:linear-gradient(180deg,#3d1420,#2c0e17);border:2px solid #ff4d5e;border-radius:16px;padding:12px 14px;font-size:1rem;line-height:1.5;color:#fff;}
.warn b{color:#ff7a92;font-weight:800;}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tip{background:linear-gradient(180deg,#1b2b47,#121f35);border:1.5px solid #2c4166;border-radius:14px;padding:16px 8px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:inset 0 1px 0 #ffffff14;}
.tip b{font-size:1.2rem;line-height:1.25;font-weight:800;text-align:right;}
.tipIc{display:grid;place-items:center;}
.tipBolt{display:grid;place-items:center;margin-left:1px;}
.warn .wtxt{flex:1;display:flex;flex-direction:column;gap:4px;}
.warn .wbig{font-size:1.18rem;line-height:1.3;color:#ff4d6a;}
.warn .wend{font-size:1.1rem;line-height:1.3;color:#ff4d6a;}
.warn .wtxt span{font-size:1.05rem;}
.warn .bolt{flex:none;width:46px;height:46px;display:grid;place-items:center;filter:drop-shadow(0 0 8px #ff3b4a) drop-shadow(0 0 16px #ff3b4a99);}
.warn .bolt svg{width:46px;height:46px;}
.chip{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;color:#1b1430;flex:none;}
.chip.tri{border-radius:0;background:none!important;width:28px;font-size:1.3rem;}
.go{font-family:var(--body);font-weight:800;font-size:1.7rem;background:linear-gradient(180deg,#a2fbe9,#55e2c6 55%,#3fd2b5);color:#062a24;border:0;border-radius:22px;padding:18px 14px;cursor:pointer;box-shadow:0 6px 0 #1f9a83,0 10px 22px #3fe0c240,inset 0 2px 0 #ffffff80;}
.go.wait{opacity:.45;}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #1f9a83,inset 0 2px 0 #ffffff80;}
.go:focus-visible,#pause:focus-visible,#mute:focus-visible,.ghost:focus-visible,#saveBtn:focus-visible{outline:3px solid var(--pill);outline-offset:3px;}
.hint{font-size:.9rem;color:#a9b6cc;line-height:1.45;}
.big{font-family:var(--display);font-size:3rem;color:var(--teal);line-height:1;font-variant-numeric:tabular-nums;}
.ghost{font-family:var(--body);font-weight:800;font-size:1.2rem;background:#0b1626;color:#fff;border:2px solid #e8c95a;border-radius:22px;padding:14px;cursor:pointer;}
h2{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0;color:var(--teal);}
h3{font-size:.95rem;font-weight:600;color:var(--ink);margin:0;}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:r;}
.lb li{counter-increment:r;display:flex;gap:10px;align-items:center;background:#ffffff0d;border-radius:10px;padding:9px 12px;}
.lb li::before{content:counter(r);font-family:var(--display);color:var(--muted);width:22px;text-align:center;}
.lb li:nth-child(1)::before{content:"🥇";}.lb li:nth-child(2)::before{content:"🥈";}.lb li:nth-child(3)::before{content:"🥉";}
.lb .nm{flex:1;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb .sc{color:var(--teal);font-weight:800;font-variant-numeric:tabular-nums;}
.lb li.me{outline:2px solid var(--teal);outline-offset:-2px;}
.empty{color:var(--muted);font-size:.9rem;padding:14px;background:#ffffff0d;border-radius:10px;}
#saveWrap{display:flex;flex-direction:column;gap:8px;}
#saveRow{display:flex;gap:8px;}
#saveTitle:empty,#lbHint:empty{display:none;}
#saveTitle{font-size:1.05rem;font-weight:700;color:var(--teal);line-height:1.45;}
#overTitle{font-size:1.25rem;font-weight:800;color:var(--teal);line-height:1.3;margin-top:-6px;}
#saveRow[hidden]+#nameHint{display:none;}
#nameHint{font-size:.82rem;margin-top:-2px;}
#nameIn{flex:1;min-width:0;font:inherit;font-size:1rem;padding:11px 12px;border-radius:12px;border:1.5px solid #ffffff33;background:#ffffff10;color:var(--ink);text-align:right;user-select:text;-webkit-user-select:text;}
#saveBtn{font-family:var(--body);font-weight:800;background:var(--teal);color:#06302a;border:0;border-radius:12px;padding:0 16px;cursor:pointer;}
#saveBtn:disabled{opacity:.35;cursor:default;}
#admin{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;background:#0b1626fa;border-top:2px solid #3fd6b8;border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));direction:rtl;color:#fff;z-index:5;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;}
.overlay .card{touch-action:pan-y;}
.adHead{display:flex;justify-content:space-between;align-items:center;font-size:1.1rem;}
.adHead button{background:#ffffff14;border:1px solid #ffffff26;color:#fff;border-radius:10px;width:38px;height:38px;font-size:1rem;cursor:pointer;}
.adRow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:#ffffff0a;border-radius:12px;padding:10px 12px;}
.adRow.master{background:#123532;border:1.5px solid #3fd6b8;}
.adRow .lbl{font-weight:700;font-size:.98rem;}
.adRow .hint2{grid-column:1/-1;font-size:.78rem;color:#a9b6cc;line-height:1.4;}
.step{display:flex;align-items:center;gap:6px;direction:ltr;}
.step button{width:44px;height:44px;border-radius:12px;border:1.5px solid #ffffff33;background:#ffffff14;color:#fff;font-size:1.4rem;font-weight:800;cursor:pointer;touch-action:manipulation;}
.step button:active{background:#3fd6b855;}
.step output{min-width:4.2em;text-align:center;font-weight:800;color:#ffd27a;font-variant-numeric:tabular-nums;font-size:1.05rem;}
.adBtns{display:flex;gap:8px;}
.adBtns button{flex:1;font:inherit;font-weight:800;padding:12px;border-radius:12px;border:1.5px solid #ffffff33;background:#ffffff10;color:#fff;cursor:pointer;}
.adBtns .save{background:var(--teal);color:#06302a;border-color:var(--teal);}
#adPw{display:flex;gap:8px;}
#pwIn{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:11px 12px;border-radius:12px;border:1.5px solid #ffffff33;background:#ffffff10;color:var(--ink);text-align:center;user-select:text;-webkit-user-select:text;}
#adMsg{font-size:.85rem;color:#ffd27a;min-height:1.2em;}
.tabs{display:flex;gap:6px;}
.tabs button{flex:1;font:inherit;font-weight:800;padding:10px;border-radius:12px;border:1.5px solid #ffffff26;background:#ffffff0a;color:#cfd8e6;cursor:pointer;}
.tabs button.on{background:#3fd6b833;border-color:#3fd6b8;color:#fff;}
#tabSet,#tabPl{display:flex;flex-direction:column;gap:10px;}
.danger{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding:12px;border:1.5px dashed #ff4d5e88;border-radius:12px;}
.danger b{font-size:.9rem;color:#ff9aa8;}
.danger button{font:inherit;font-weight:800;padding:11px;border-radius:12px;border:1.5px solid #ff4d5e;background:#ff3b4a22;color:#fff;cursor:pointer;}
.danger button.sure{background:#ff3b4a;}
.sum{background:#123532;border:1.5px solid #3fd6b8;border-radius:12px;padding:12px;font-size:.88rem;line-height:1.6;}
.sum b{color:#7fe9d4;}
.pl{background:#ffffff0a;border-radius:12px;overflow:hidden;}
.pl>button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1.6em 1fr auto auto;gap:8px;align-items:center;padding:11px 12px;cursor:pointer;}
.pl .rk{color:#a9b6cc;font-weight:800;text-align:center;}
.pl .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pl .sc{color:var(--teal);font-weight:800;font-variant-numeric:tabular-nums;}
.pl .tm{color:#ffd27a;font-weight:700;font-variant-numeric:tabular-nums;font-size:.85rem;min-width:3.2em;text-align:left;}
.pl .det{padding:0 12px 12px;font-size:.84rem;line-height:1.55;display:flex;flex-direction:column;gap:8px;}
.pl .det ul{margin:0;padding-inline-start:18px;}
.pl .rounds{color:#cfd8e6;font-variant-numeric:tabular-nums;}
.pl .rounds div{padding:3px 0;border-top:1px solid #ffffff12;}
.pl .rounds .z{color:#ff9aa8;}
.pl .del{align-self:flex-start;font:inherit;font-size:.8rem;font-weight:700;padding:7px 10px;border-radius:10px;border:1.5px solid #ff4d5e;background:#ff3b4a22;color:#fff;cursor:pointer;}
.pl .del.sure{background:#ff3b4a;}
#board{background:linear-gradient(180deg,#0e1d33f5,#08111ff8);}
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud" hidden>
    <div>
      <div class="score" id="score">0 מ"ג</div>
      <div class="sub" id="best">השיא שלי: 0 מ"ג</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="lives" id="lives">❤️❤️❤️</div>
      
      <button id="mute" aria-label="צליל">🔊</button>
      <button id="pause" aria-label="השהה"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><rect x="3.5" y="2.5" width="5" height="15" rx="1.5" fill="currentColor"/><rect x="11.5" y="2.5" width="5" height="15" rx="1.5" fill="currentColor"/></svg></button>
    </div>
  </div>

  <div class="overlay" id="start">
    <div class="card">
      <h1>מינונים</h1>
      <p class="goal">המטרה: לבלוע כמה שיותר כדורים.</p>
      <div class="doses">
        <div class="pills">
          <div><span class="cap" style="--c:var(--pill2)"></span><span>ורוד</span><b style="--c:#ff7fb8">1 מ"ג</b></div>
          <div><span class="cap" style="--c:var(--pill)"></span><span>כחול</span><b style="--c:#40c8ff">5 מ"ג</b></div>
          <div><span class="cap big" style="--c:var(--ster)"></span><span>סטרואידים</span><b style="--c:#ffc93c">15 מ"ג</b></div>
        </div>
      </div>
      <div class="tips">
        <div class="tip"><span class="tipIc" aria-hidden="true"><svg viewBox="0 0 36 44" width="36" height="44"><rect x="1" y="4" width="34" height="39" rx="4" fill="#d9894a" stroke="#a85f2a" stroke-width="1.5"/><rect x="5" y="9" width="26" height="31" rx="1.5" fill="#fbfbf7"/><rect x="11" y="1" width="14" height="8" rx="2.5" fill="#9fb4c4" stroke="#6f8696" stroke-width="1.2"/><circle cx="18" cy="4" r="1.6" fill="#6f8696"/><g stroke="#9aa6b2" stroke-width="1.6" stroke-linecap="round"><line x1="9" y1="15" x2="27" y2="15"/><line x1="9" y1="20" x2="27" y2="20"/><line x1="9" y1="25" x2="27" y2="25"/><line x1="9" y1="30" x2="27" y2="30"/></g><line x1="9" y1="35" x2="19" y2="35" stroke="#2fc9a8" stroke-width="1.6" stroke-linecap="round"/></svg></span><b style="color:#3fe6c4">חידוש<br>מרשמים</b></div>
        <div class="tip"><span class="tipBolt" aria-hidden="true"><svg viewBox="11.5 2.5 26 43" width="27" height="45"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a86"/><stop offset=".55" stop-color="#ff2d43"/><stop offset="1" stop-color="#c40f25"/></linearGradient></defs><polygon points="28,4 13,26.4 23,26.4 18,44 36,20.4 25.6,20.4 33,4" fill="url(#bg1)" stroke="#8a0016" stroke-width="2" stroke-linejoin="round"/><polygon points="28,6.8 18,24 20.8,24 30,6.8" fill="#ffffff66"/></svg></span><b style="color:#ff4d6a">זהירות<br>מפרכוסים</b></div>
      </div>
      <button class="go" id="startBtn">יאללה כדורים</button>
      <button class="ghost" data-board>🏆 טבלת שיאים</button>
      <div class="hint" id="meLine"></div>
      <div class="hint">עם סאונד 🔊</div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="card">
      <div class="big" id="final">0 מ"ג</div>
      <div id="overTitle" hidden></div>
      <p class="tag" id="overMsg" style="font-size:1.35rem;font-weight:800;color:#ffe08a;line-height:1.35;margin:0;text-shadow:0 2px 10px rgba(0,0,0,.5)"></p>
      <div id="saveWrap" hidden>
        <h3 id="saveTitle"></h3>
        <div id="saveRow">
          <input id="nameIn" maxlength="14" placeholder="בחר שם שיופיע בטבלת השיאים!" autocomplete="nickname">
          <button id="saveBtn">שמור</button>
        </div>
        <div class="hint" id="nameHint">בלי שם, הניקוד לא יישמר בטבלת השיאים.</div>
      </div>
      <button class="go" id="againBtn">עוד כדורים!</button>
      <button class="ghost" data-board id="overBoard" hidden>🏆 טבלת שיאים</button>
    </div>
  </div>

  <div class="overlay" id="pauseMenu" hidden>
    <div class="card">
      <h2>הפסקה</h2>
      <button class="go" id="resumeBtn">▶ להמשיך</button>
      <button class="ghost" id="restartBtn">↻ להתחיל מחדש</button>
      <div class="hint">הסיבוב הזה לא יישמר.</div>
    </div>
  </div>

  <div class="overlay" id="board" hidden>
    <div class="card">
      <h2>טבלת השיאים</h2>
      <ol class="lb" id="lbList"></ol>
      <div class="hint" id="lbHint"></div>
      <button class="go" id="boardBack">חזרה</button>
    </div>
  </div>
  <div id="admin" hidden>
    <div class="adHead"><b>🧪 מעבדה</b><button id="adClose" aria-label="סגור">✕</button></div>
    <div id="adPw"><input id="pwIn" type="password" inputmode="numeric" placeholder="סיסמה" autocomplete="off"><button class="go" id="pwBtn" style="font-size:1.1rem;padding:10px 18px;border-radius:14px">כניסה</button></div>
    <div id="adBody" hidden>
      <div class="tabs"><button data-tab="Set" class="on">⚙️ הגדרות</button><button data-tab="Pl">👥 שחקנים</button></div>
      <div id="tabSet">
        <div id="adRows"></div>
        <div class="adBtns"><button class="save" id="adSave">שמור לכל השחקנים</button><button id="adDef">ברירת מחדל</button></div>
        <div class="danger"><b>מחיקה (אין דרך לבטל)</b>
          <button id="delScores">מחק את כל טבלת השיאים</button>
          <button id="resetMe">אפס את השם בטלפון הזה (לבדיקות)</button>
          <button id="delRounds">מחק את נתוני השחקנים (זמנים ופרכוסים)</button>
        </div>
      </div>
      <div id="tabPl" hidden><div class="sum" id="plSum">טוען...</div><div id="plList"></div></div>
    </div>
    <div id="adMsg"></div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1,U=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth||innerWidth;H=cv.clientHeight||innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);U=Math.min(W,H*0.6)/400;}
addEventListener('resize',resize);resize();

let best=0; try{best=+localStorage.getItem('mnBest')||0}catch(e){}
const fmt=n=>Math.round(n).toLocaleString('he-IL')+' מ"ג';

// ---- state ----

const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
// phase 0..1 = warm-up, 1..2 = getting into action, then "since action" seconds
function diff(t){
  const into=smooth((t-P.warm)/Math.max(1,P.action-P.warm)), after=Math.max(0,t-P.action);
  const speed=t<P.warm?150+20*(t/P.warm):170+(P.speedAct-170)*into+after*P.speedGrow+after*after*P.speedAccel; // keeps getting faster, never levels off
  const rate=t<P.warm?P.rate0:Math.min(P.rateMax,P.rate0+(P.rateAct-P.rate0)*into+after*(P.rateMax-P.rateAct)/60);
  const szRate=(t<P.warm?P.szR0:Math.min(P.szRMax,P.szR0+(P.szRAct-P.szR0)*into+after*P.szRGrow))*P.K; // seizures per second, on top of the pills
  return{speed:speed*P.K,rate,szRate};}
let BONUS_LEN=P.rxLen;
const TYPES={
  pill:{c:'#4cc3ff',v:5},
  pill2:{c:'#ff8fc8',v:1},
  ster:{c:'#ffc93c',v:15},
  seize:{c:'#ff3b4a',v:-15},
  rx:{c:'#57d6c2',v:0}
};
function pick(){
  let w;
  if(S.bonus>0) w=[['pill',36],['pill2',36],['ster',28]];
  else{
    if(S.t>P.warm&&S.t-S.lastRxSpawn>=P.rxGap&&S.t-S.lastRx>=P.rxGap&&!S.items.some(i=>i.k==='rx')){S.lastRxSpawn=S.t;return'rx';}
    w=[['pill',30],['pill2',28],['ster',18]];
  }
  let sum=w.reduce((a,b)=>a+b[1],0),r=Math.random()*sum;for(const[k,v]of w){if((r-=v)<0)return k}return'pill';}

function reset(){Object.assign(S,{run:true,paused:false,score:0,lives:3,t:0,spawnT:.6,items:[],fx:[],texts:[],hit:0,seize:0,gulp:0,mouth:0,bonus:0,lastRx:0,lastRxSpawn:0,total:0,resets:0,szT:2.5,calm:0,szLog:[]});S.px=S.tx=W/2;updHud();}

function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:0.32;
    const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);}catch(e){AC=null}}
function note(f,at,dur,type='sine',vol=.5,f2){if(!AC)return;const t0=AC.currentTime+at;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05);}
function bell(f,at,dur=.35,vol=.45){note(f,at,dur,'sine',vol);note(f*2,at,dur*.6,'sine',vol*.25);note(f*3.01,at,dur*.3,'triangle',vol*.08);}

let keys={};
const SENS=1.4;let drag=null;
for(const el of[cv]){
  el.addEventListener('pointerdown',e=>{try{el.setPointerCapture(e.pointerId)}catch(_){}drag={id:e.pointerId,x:e.clientX,t:S.tx};e.preventDefault()});
  el.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;
    const lo=40*U,hi=W-40*U,want=drag.t+(e.clientX-drag.x)*SENS,v=Math.max(lo,Math.min(hi,want));
    S.tx=v;if(v!==want){drag.x=e.clientX;drag.t=v}});

}

// ---- hero geometry: front-facing head; the mouth opens only to swallow ----
function headScale(){return 1+Math.min(S.score,800)/800*0.15}
function fatness(){return 1+Math.min(S.score,1000)/1000*0.5} // body slowly widens with every mg swallowed
function headR(){return 22*U*headScale()}
function headY(){return groundY()-100*U-headR()*0.8}
function mouthBox(){const R=headR();return{x:S.px,y:headY()+R*.1,rx:R*1.2,ry:R};}
function shoulderBox(){const f=fatness();return{x:S.px,y:groundY()-96*U,rx:30*U*f,ry:9*U};}

// ---- loop ----
let last=performance.now();
function loop(now){if(!S.run&&!S.px)S.px=S.tx=W/2;const dt=Math.min((now-last)/1000,0.05);last=now;if(S.run&&!S.paused)update(dt);draw(now/1000);requestAnimationFrame(loop);}
requestAnimationFrame(loop);

function update(dt){
  S.t+=dt;S.total=(S.total||0)+dt;
  if(keys.ArrowLeft)S.tx-=520*U*dt; if(keys.ArrowRight)S.tx+=520*U*dt;
  S.tx=Math.max(40*U,Math.min(W-40*U,S.tx));
  const prev=S.px;
  const ctl=S.seize>0?3:14; // a seizure makes the body sluggish and pulls it off course
  S.px+=(S.tx-S.px)*Math.min(1,dt*ctl);
  if(S.seize>0)S.px+=Math.sin(S.t*17)*140*U*dt*(S.seize/SEIZE_LEN);
  S.px=Math.max(36*U,Math.min(W-36*U,S.px));
  const v=S.px-prev; if(Math.abs(v)>.3)S.face=v>0?1:-1; S.step+=Math.abs(v)*0.08;
  S.bonus=Math.max(0,S.bonus-dt);
  // seizure stream: its own clock; paused during the prescription rain and for a moment after it
  if(S.bonus>0)S.calm=2;else S.calm=Math.max(0,S.calm-dt);
  if(S.bonus<=0&&S.calm<=0){S.szT-=dt;if(S.szT<=0){const d=diff(S.t);
    S.items.push({k:'seize',x:30*U+Math.random()*(W-60*U),y:-30*U,vy:(d.speed+Math.random()*60)*U,rot:Math.random()*6,vr:(Math.random()-.5)*3,sw:Math.random()*6});
    S.szT=(1/d.szRate)*(0.6+Math.random()*0.8)/1.0;}}
  S.spawnT-=dt; if(S.spawnT<=0){const k=pick();const speed=(diff(S.t).speed+Math.random()*60)*U*(k==='ster'?0.85:k==='rx'?0.75:1)*(S.bonus>0?0.9:1);
    S.items.push({k,x:30*U+Math.random()*(W-60*U),y:-30*U,vy:speed,rot:Math.random()*6,vr:(Math.random()-.5)*3,sw:Math.random()*6});
    S.spawnT=S.bonus>0?(0.07+Math.random()*0.07)/Math.max(0.1,P.rxRate):(1/diff(S.t).rate)*(0.6+Math.random()*0.7)/0.95;}
  const mb=mouthBox(),sb=shoulderBox();
  for(let i=S.items.length-1;i>=0;i--){const it=S.items[i];if(!it)continue;it.y+=it.vy*dt;it.rot+=it.vr*dt;it.sw+=dt*2;
    const ix=it.x+Math.sin(it.sw)*6*U;
    const dx=(ix-mb.x)/(mb.rx+12*U),dy=(it.y-mb.y)/(mb.ry+14*U);
    const sx2=(ix-sb.x)/(sb.rx+12*U),sy2=(it.y-sb.y)/(sb.ry+14*U);
    if(dx*dx+dy*dy<1||sx2*sx2+sy2*sy2<1){swallow(it,ix);const j=S.items.indexOf(it);if(j>=0)S.items.splice(j,1);if(!S.run)return;if(!S.items.length)break;continue}
    if(it.y>H+40)S.items.splice(i,1);}
  for(let i=S.fx.length-1;i>=0;i--){const p=S.fx[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*U*dt;p.l-=dt;if(p.l<=0)S.fx.splice(i,1)}
  for(let i=S.texts.length-1;i>=0;i--){const t=S.texts[i];t.y-=60*U*dt;t.l-=dt;if(t.l<=0)S.texts.splice(i,1)}
  S.hit=Math.max(0,S.hit-dt);S.seize=Math.max(0,S.seize-dt);S.gulp=Math.max(0,S.gulp-dt);
  // open wide when something good is about to land in the mouth, snap shut on the swallow
  let near=false;
  if(!S.seize&&!S.gulp)for(const it of S.items){if(it.k==='seize')continue;const ix=it.x+Math.sin(it.sw)*6*U,dy=mb.y-it.y;if(dy>-10*U&&dy<130*U&&Math.abs(ix-mb.x)<mb.rx+26*U){near=true;break}}
  const want=near?1:0;S.mouth+=(want-S.mouth)*Math.min(1,dt*(want?14:18));
}

function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(80+Math.random()*220)*U;S.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120*U,c,l:.5+Math.random()*.4,r:(2+Math.random()*3)*U})}}
function say(x,y,txt,c){S.texts.push({x,y,txt,c,l:1})}

function swallow(it,x){
  const T=TYPES[it.k],v=T.v;S.gulp=.22;S.mouth=Math.min(S.mouth,.35);
  if(it.k==='rx'){
    BONUS_LEN=P.rxLen;S.bonus=BONUS_LEN;S.lastRx=S.t;SND.rx();burst(x,it.y,'#57d6c2',16);
    say(x,it.y-24*U,'חידוש מרשמים!','#bff5ec');
    for(const o of S.items)if(o.k==='seize'){o.k='pill';burst(o.x,o.y,'#4cc3ff',6)} // falling seizures turn into pills
    updHud();return;
  }
  say(x,it.y-20*U,(v>0?'+':'')+v,T.c);
  if(it.k==='pill'||it.k==='pill2')SND.pill();else if(it.k==='ster')SND.rad();else SND.seize();
  S.score=Math.max(0,S.score+v);
  burst(x,it.y,T.c,it.k==='seize'?14:12);
  if(it.k==='seize'){S.szLog.push(Math.round(S.total||S.t));S.lives--;S.hit=.8;S.seize=SEIZE_LEN;S.gulp=0;if(navigator.vibrate)try{navigator.vibrate(200)}catch(e){}
    updHud();if(S.lives<=0){end();return;}
    if(P.resetOnSeize){ // the screen clears for a short breather, then the pace carries on where it was
      for(const o of S.items)burst(o.x,o.y,'#ffffff',4);
      S.items=[];S.bonus=0;S.spawnT=1.4;S.resets++;}
    S.calm=Math.max(S.calm,P.calm);S.szT=Math.max(S.szT,1/Math.max(1e-6,diff(S.t).szRate));}
  updHud();
}

function groupPlayers(data){const names=data.names||{},m=new Map();

  const list=[...m.values()];
  for(const p of list){p.rounds.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    p.name=names[p.dev]||[...p.rounds].reverse().find(r=>r.name)?.name||'';
    p.best=p.rounds.reduce((a,b)=>b.score>a.score?b:a,p.rounds[0]);}
  list.sort((a,b)=>b.best.score-a.best.score);return list;}

function insights(p,all,rank){const R=p.rounds,n=R.length,secs=R.map(r=>r.secs),out=[];
  out.push(`${n} ${n===1?'סבב':'סבבים'}, ${mmss(secs.reduce((a,b)=>a+b,0))} דקות משחק בסך הכול. שיחק לאחרונה ${when(R[n-1].created_at)}.`);
  out.push(`סבב ממוצע ${mmss(avg(secs))}, הכי ארוך ${mmss(Math.max(...secs))}. השיא ${fmtN(p.best.score)} מ"ג ב־${mmss(p.best.secs)} (מקום ${rank} מתוך ${all.length}).`);
  const mpm=p.best.secs?p.best.score/(p.best.secs/60):0;if(mpm)out.push(`בסבב השיא אסף ${fmtN(mpm)} מ"ג לדקה.`);
  if(n>=4){const k=Math.min(3,Math.floor(n/2)),a=avg(R.slice(0,k).map(r=>r.score)),b=avg(R.slice(-k).map(r=>r.score));
    out.push(b>a*1.15?`משתפר: מ־${fmtN(a)} בממוצע בסבבים הראשונים ל־${fmtN(b)} באחרונים.`:b<a*0.85?`יורד: מ־${fmtN(a)} בממוצע בהתחלה ל־${fmtN(b)} בסבבים האחרונים.`:`יציב: בערך ${fmtN(b)} מ"ג לסבב.`);}
  const first=R.map(r=>(r.seizes||[])[0]).filter(x=>x!=null),allZ=R.flatMap(r=>r.seizes||[]);
  if(first.length)out.push(`הפרכוס הראשון מגיע בממוצע ב־${mmss(avg(first))}.`);
  if(allZ.length>=3){const early=allZ.filter(x=>x<60).length/allZ.length;
    if(early>=0.4)out.push(`${Math.round(early*100)}% מהפרכוסים שלו בדקה הראשונה, נראה שההתחלה קשה לו.`);
    else if(allZ.every(x=>x>=120))out.push('כל הפרכוסים שלו אחרי 2:00, ההתחלה קלה לו.');}
  let quick=0;for(const r of R){const z=r.seizes||[];for(let i=1;i<z.length;i++)if(z[i]-z[i-1]<=10)quick++;}
  if(quick)out.push(`${quick} ${quick===1?'פעם':'פעמים'} פרכס שוב תוך 10 שניות או פחות.`);
  const short=R.filter(r=>r.secs<60).length;if(short&&n>=3)out.push(`${short} מתוך ${n} סבבים נגמרו לפני דקה.`);
  const ks=[...new Set(R.map(r=>r.k||100))];if(ks.length>1||ks[0]!==100)out.push('שיחק גם ברמות קושי כללי: '+ks.map(k=>k+'%').join(', ')+'.');
  return out;}
function summary(all){const R=all.flatMap(p=>p.rounds);if(!R.length)return'עוד אין סבבים. ברגע שמישהו יסיים סבב הוא יופיע כאן.';
  const secs=R.map(r=>r.secs).sort((a,b)=>a-b),med=secs[Math.floor(secs.length/2)],over3=R.filter(r=>r.secs>=180).length;
  const Z=R.flatMap(r=>r.seizes||[]),first=R.map(r=>(r.seizes||[])[0]).filter(x=>x!=null);
  const bins=[0,0,0,0];for(const z of Z)bins[Math.min(3,Math.floor(z/60))]++;const pc=i=>Z.length?Math.round(bins[i]/Z.length*100):0;
  return `<b>${all.length}</b> שחקנים · <b>${R.length}</b> סבבים · <b>${mmss(secs.reduce((a,b)=>a+b,0))}</b> דקות משחק<br>`+
    `סבב ממוצע <b>${mmss(avg(secs))}</b> · חציון <b>${mmss(med)}</b> · <b>${Math.round(over3/R.length*100)}%</b> מהסבבים הגיעו ל־3:00<br>`+
    (first.length?`פרכוס ראשון בממוצע ב־<b>${mmss(avg(first))}</b><br>`:'')+
    (Z.length?`מתי פרכסו: דקה ראשונה <b>${pc(0)}%</b> · שנייה <b>${pc(1)}%</b> · שלישית <b>${pc(2)}%</b> · אחרי 3:00 <b>${pc(3)}%</b>`:'');}

  ctx.fillStyle='#57d6c266';rr(sx+sw*.56,gy-sh-12*U,sw*.2,sh*.44,7*U);ctx.fill();
  ctx.fillStyle='#e2b04a88';rr(sx+sw*.77,gy-sh-10*U,sw*.17,sh*.4,7*U);ctx.fill();
  // black dog lying on the sofa, head up, facing left
  {const ox=sx+sw*.42,oy=gy-sh*.55-6*U,u=U*1.05,wag=Math.sin(t*5)*.35,pant=Math.sin(t*6)*.5+.5;
  ctx.save();ctx.translate(ox,oy);ctx.scale(-1,1);
  const fur='#1d1c20',dark='#0f0e11';
  ctx.strokeStyle=fur;ctx.lineWidth=5*u;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-26*u,-14*u);ctx.quadraticCurveTo(-36*u,-20*u,-34*u+Math.sin(wag)*6*u,-32*u);ctx.stroke(); // tail
  ctx.fillStyle=fur;
  ctx.beginPath();ctx.ellipse(-2*u,-11*u,26*u,11*u,0,0,7);ctx.fill();           // body
  ctx.beginPath();ctx.arc(-16*u,-12*u,12*u,0,7);ctx.fill();                       // haunch
  rr(-26*u,-6*u,16*u,6*u,3*u);ctx.fill();                                         // back paw
  rr(10*u,-6.5*u,24*u,6.5*u,3.2*u);ctx.fill();rr(13*u,-3.5*u,22*u,5*u,2.5*u);ctx.fillStyle=dark;ctx.fill(); // front legs
  ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(18*u,-19*u,10*u,13*u,-.35,0,7);ctx.fill(); // chest + neck
  ctx.beginPath();ctx.ellipse(25*u,-33*u,10*u,9*u,0,0,7);ctx.fill();             // head
  ctx.beginPath();ctx.ellipse(35*u,-29.5*u,9*u,5.5*u,.12,0,7);ctx.fill();        // snout
  ctx.fillStyle='#ff8fa3';ctx.beginPath();ctx.ellipse(37*u,-23*u+pant*1.2*u,2.6*u,3.5*u+pant*1.2*u,.15,0,7);ctx.fill(); // tongue
  ctx.fillStyle='#55505c';ctx.beginPath();ctx.arc(43.5*u,-31*u,2.6*u,0,7);ctx.fill();   // nose
  ctx.fillStyle=dark;ctx.beginPath();ctx.ellipse(20*u,-31*u,4.8*u,9.5*u,.4,0,7);ctx.fill(); // floppy ear
  ctx.fillStyle='#d9cfbd';ctx.beginPath();ctx.arc(29*u,-35.5*u,2.2*u,0,7);ctx.fill();   // eye
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(29.6*u,-35.5*u,1.3*u,0,7);ctx.fill();
  ctx.fillStyle='#ffffff0a';ctx.beginPath();ctx.ellipse(-6*u,-19*u,9*u,1.8*u,-.05,0,7);ctx.fill(); // sheen
  ctx.restore();}
  // floor lamp
  ctx.strokeStyle='#2a2520';ctx.lineWidth=3*U;ctx.beginPath();ctx.moveTo(lx,gy-2*U);ctx.lineTo(lx,ly);ctx.stroke();
  ctx.fillStyle='#2a2520';ctx.beginPath();ctx.ellipse(lx,gy-2*U,12*U,3.5*U,0,0,7);ctx.fill();
  ctx.fillStyle='#efe1c3';ctx.beginPath();ctx.moveTo(lx-13*U,ly);ctx.lineTo(lx+13*U,ly);ctx.lineTo(lx+20*U,ly+24*U);ctx.lineTo(lx-20*U,ly+24*U);ctx.closePath();ctx.fill();
  // floor plant
  const qx=W*0.08;
  ctx.fillStyle='#5f8a5a';for(let i=0;i<7;i++){const a=-Math.PI/2+(i-3)*.32+Math.sin(t*.8+i)*.03;ctx.save();ctx.translate(qx,gy-30*U);ctx.rotate(a+Math.PI/2);ctx.beginPath();ctx.ellipse(0,-22*U,6*U,22*U,0,0,7);ctx.fill();ctx.restore();}
  ctx.fillStyle='#b87a56';ctx.beginPath();ctx.moveTo(qx-15*U,gy-32*U);ctx.lineTo(qx+15*U,gy-32*U);ctx.lineTo(qx+11*U,gy-6*U);ctx.lineTo(qx-11*U,gy-6*U);ctx.closePath();ctx.fill();
}

function draw(t){
  ctx.save();
  const gy=groundY();
  drawRoom(t,gy);
  for(const it of S.items)drawItem(it);
  drawHero(t,gy);
  for(const p of S.fx){ctx.globalAlpha=Math.max(0,p.l*1.6);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.font=`800 ${22*U}px Rubik, sans-serif`;
  for(const tx of S.texts){ctx.globalAlpha=Math.min(1,tx.l*2);ctx.fillStyle='#0008';ctx.fillText(tx.txt,tx.x+2,tx.y+2);ctx.fillStyle=tx.c;ctx.fillText(tx.txt,tx.x,tx.y)}ctx.globalAlpha=1;
  if(S.bonus>0){
    const a=.08+.04*Math.sin(t*3);ctx.fillStyle=`rgba(87,214,194,${a})`;ctx.fillRect(0,0,W,H);
    const bw=W*0.6,bx=(W-bw)/2,by=H*0.16;
    ctx.fillStyle='#0007';rr(bx,by,bw,10*U,5*U);ctx.fill();
    ctx.fillStyle='#57d6c2';rr(bx,by,bw*(S.bonus/BONUS_LEN),10*U,5*U);ctx.fill();
    ctx.font=`400 ${28*U}px "Secular One", sans-serif`;ctx.fillStyle='#0008';ctx.fillText('חידוש מרשמים',W/2+2,by-10*U+2);
    ctx.fillStyle='#d8fff7';ctx.fillText('חידוש מרשמים',W/2,by-10*U);
  }
  
  ctx.restore();
}

const sprites={};let spriteKey='';
function itemAngle(it){return it.k==='seize'?Math.sin(it.sw*3)*.15:it.k==='rx'?Math.sin(it.sw)*.2:it.rot;}
function drawItem(it){
  const key=U+'@'+DPR;if(key!==spriteKey){spriteKey=key;for(const k in sprites)delete sprites[k];}
  let sp=sprites[it.k];
  if(!sp){const size=Math.ceil(18*U*5);sp=document.createElement('canvas');sp.width=Math.ceil(size*DPR);sp.height=Math.ceil(size*DPR);
    const g=sp.getContext('2d');g.scale(DPR,DPR);const main=ctx;ctx=g;
    try{drawItemRaw({k:it.k,x:size/2,y:size/2,sw:0,rot:0});}finally{ctx=main;}
    sp.size=size;sprites[it.k]=sp;}
  ctx.save();ctx.translate(it.x+Math.sin(it.sw)*6*U,it.y);ctx.rotate(itemAngle(it));
  ctx.drawImage(sp,-sp.size/2,-sp.size/2,sp.size,sp.size);ctx.restore();
}
function drawItemRaw(it){
  const r=18*U,x=it.x+Math.sin(it.sw)*6*U,y=it.y,T=TYPES[it.k];
  ctx.save();ctx.translate(x,y);
  ctx.shadowColor=T.c;ctx.shadowBlur=14*U;ctx.textAlign='center';ctx.textBaseline='middle';
  if(it.k==='pill'||it.k==='pill2'||it.k==='ster'){
    ctx.rotate(it.rot);
    const big=it.k==='ster'?1.18:1,L=r*1.15*big,h=r*.5*big;
    ctx.beginPath();ctx.roundRect(-L,-h,L*2,h*2,h);ctx.fillStyle='#f4fbff';ctx.fill();ctx.shadowBlur=0;
    ctx.save();ctx.beginPath();ctx.roundRect(-L,-h,L*2,h*2,h);ctx.clip();ctx.fillStyle=T.c;ctx.fillRect(0,-h,L,h*2);ctx.restore();
    ctx.strokeStyle='#0003';ctx.lineWidth=1.2*U;ctx.beginPath();ctx.moveTo(0,-h);ctx.lineTo(0,h);ctx.stroke();
    ctx.fillStyle='#fff9';ctx.beginPath();ctx.roundRect(-L*.75,-h*.62,L*1.4,h*.38,h*.2);ctx.fill();
  }else if(it.k==='seize'){
    // red lightning bolt: clearly bad
    ctx.rotate(Math.sin(it.sw*3)*.15);
    const q=r*1.35;
    const bolt=()=>{ctx.beginPath();ctx.moveTo(q*.2,-q);ctx.lineTo(-q*.55,q*.12);ctx.lineTo(-q*.05,q*.12);ctx.lineTo(-q*.3,q);ctx.lineTo(q*.6,-q*.18);ctx.lineTo(q*.08,-q*.18);ctx.lineTo(q*.45,-q);ctx.closePath();};
    ctx.lineJoin='round';bolt();ctx.fillStyle=T.c;ctx.fill();ctx.shadowBlur=0;
    bolt();ctx.lineWidth=3*U;ctx.strokeStyle='#5c000c';ctx.stroke();
    ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.moveTo(q*.2,-q*.86);ctx.lineTo(-q*.3,0);ctx.lineTo(-q*.16,0);ctx.lineTo(q*.3,-q*.86);ctx.closePath();ctx.fill();
  }else{
    // prescription sheet
    ctx.rotate(Math.sin(it.sw)*.2);
    const pw=r*1.6,ph=r*2.05;
    ctx.fillStyle='#fdfdf9';ctx.beginPath();ctx.moveTo(-pw/2,-ph/2);ctx.lineTo(pw/2-r*.4,-ph/2);ctx.lineTo(pw/2,-ph/2+r*.4);ctx.lineTo(pw/2,ph/2);ctx.lineTo(-pw/2,ph/2);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#d9dcd2';ctx.beginPath();ctx.moveTo(pw/2-r*.4,-ph/2);ctx.lineTo(pw/2-r*.4,-ph/2+r*.4);ctx.lineTo(pw/2,-ph/2+r*.4);ctx.closePath();ctx.fill();
    ctx.fillStyle='#2a9283';ctx.font=`800 ${r*.42}px Rubik, sans-serif`;ctx.fillText('מרשם',0,-ph*.24);
    ctx.fillStyle='#c9ccc2';for(let i=0;i<3;i++)ctx.fillRect(-pw*.36,ph*.02+i*r*.3,pw*.72-(i===2?pw*.3:0),r*.1);
    ctx.strokeStyle='#3ddc97';ctx.lineWidth=2.4*U;ctx.beginPath();ctx.arc(pw*.2,ph*.3,r*.3,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(pw*.08,ph*.3);ctx.lineTo(pw*.17,ph*.39);ctx.lineTo(pw*.33,ph*.2);ctx.stroke();
  }
  ctx.restore();
}

function drawHero(t,gy){
  const s=U,f=S.face,sz=S.seize>0?Math.min(1,S.seize/0.6):0;
  const shakeX=sz?Math.sin(t*48)*3.5*s*sz:0, tilt=sz?Math.sin(t*31)*.08*sz:0;
  const running=S.run&&!S.paused&&Math.abs(S.tx-S.px)>2*U&&!sz;
  const ph=running?S.step:t*2, sw=running?Math.sin(ph)*0.6:sz?Math.sin(t*40)*.25:0, bob=running?Math.abs(Math.sin(ph))*4*s:Math.sin(t*2)*1.5*s;
  ctx.save();ctx.translate(S.px+shakeX,gy-bob);
  ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,bob,30*s,6*s,0,0,7);ctx.fill();
  ctx.rotate(tilt);
  const fat=fatness();
  // legs + sneakers
  for(const k of[-1,1]){ctx.save();ctx.translate(k*9*s*(1+(fat-1)*.6),-46*s);ctx.rotate(sw*k);
    ctx.fillStyle='#4a5a7a';rr(-6*s,0,12*s,40*s,5*s);ctx.fill();
    ctx.fillStyle='#f2efe8';rr(-8*s+f*3*s,36*s,18*s,9*s,4*s);ctx.fill();ctx.fillStyle='#57d6c2';ctx.fillRect(-8*s+f*3*s,42*s,18*s,3*s);
    ctx.restore();}
  const skin='#f0c09a',skinDark='#dcaa84',shirt='#5aa7a0',shirtDark='#3e837d';
  // arms hang at the sides and swing a little
  ctx.strokeStyle=skin;ctx.lineWidth=8*s;ctx.lineCap='round';
  for(const k of[-1,1]){const a=sz?Math.sin(t*37+k)*.4:sw*k*.5;ctx.beginPath();ctx.moveTo(k*20*s*fat,-94*s);ctx.lineTo(k*24*s*fat+Math.sin(a)*14*s,-62*s);ctx.stroke();
    ctx.fillStyle=skin;ctx.beginPath();ctx.arc(k*24*s*fat+Math.sin(a)*14*s,-60*s,5*s,0,7);ctx.fill();}
  // t-shirt
  ctx.fillStyle=shirt;rr(-22*s*fat,-102*s,44*s*fat,58*s,10*s*fat);ctx.fill();
  if(fat>1.04){ctx.beginPath();ctx.ellipse(0,-66*s,22*s*fat,(18+(fat-1)*16)*s,0,0,7);ctx.fill();} // belly
  for(const k of[-1,1]){ctx.save();ctx.translate(k*20*s*fat,-97*s);ctx.rotate(k*-0.5);ctx.fillStyle=shirt;rr(-7*s,-6*s,14*s,15*s,4*s);ctx.fill();ctx.fillStyle=shirtDark;ctx.fillRect(-7*s,6*s,14*s,3*s);ctx.restore();}
  ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(0,-102*s,7*s,4*s,0,0,Math.PI);ctx.fill();
  ctx.fillStyle=shirtDark;ctx.fillRect(-21*s*fat,-49*s,42*s*fat,4*s);
  // neck + head, facing us
  const R=headR(),hy=-100*s-R*.8;
  ctx.fillStyle=skin;ctx.fillRect(-5*s,-108*s,10*s,9*s);
  ctx.beginPath();ctx.arc(0,hy,R,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(-R,hy+R*.05,R*.18,R*.28,0,0,7);ctx.ellipse(R,hy+R*.05,R*.18,R*.28,0,0,7);ctx.fill();
  ctx.fillStyle=skinDark;ctx.beginPath();ctx.ellipse(-R,hy+R*.05,R*.08,R*.15,0,0,7);ctx.ellipse(R,hy+R*.05,R*.08,R*.15,0,0,7);ctx.fill();
  // short hair
  // soft side-swept hair with a little tuft on top
  ctx.fillStyle='#4a3324';ctx.beginPath();
  ctx.moveTo(-R*1.02,hy+R*.08);
  ctx.bezierCurveTo(-R*1.16,hy-R*.95,-R*.4,hy-R*1.3,R*.15,hy-R*1.17);
  ctx.bezierCurveTo(R*.82,hy-R*1.1,R*1.17,hy-R*.6,R*1.02,hy+R*.08);
  ctx.bezierCurveTo(R*.94,hy-R*.3,R*.74,hy-R*.5,R*.48,hy-R*.52);
  ctx.bezierCurveTo(R*.12,hy-R*.62,-R*.28,hy-R*.44,-R*.62,hy-R*.5);
  ctx.bezierCurveTo(-R*.82,hy-R*.4,-R*.94,hy-R*.2,-R*1.02,hy+R*.08);
  ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(R*.02,hy-R*1.14);ctx.quadraticCurveTo(R*.2,hy-R*1.48,R*.44,hy-R*1.3);ctx.quadraticCurveTo(R*.28,hy-R*1.3,R*.22,hy-R*1.12);ctx.fill();
  ctx.strokeStyle='#7a5640';ctx.lineWidth=2*U;ctx.lineCap='round';ctx.beginPath();ctx.arc(-R*.15,hy-R*.45,R*.6,Math.PI*1.18,Math.PI*1.48);ctx.stroke();
  // eyes look at what's falling (spirals during a seizure)
  const ex=R*.36,ey=hy-R*.1,er=R*.17;
  for(const k of[-1,1]){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(k*ex,ey,er,er*1.12,0,0,7);ctx.fill();
    if(sz){ctx.strokeStyle='#14122b';ctx.lineWidth=1.5*s;ctx.beginPath();
      for(let a=0;a<Math.PI*4;a+=.3){const r2=er*.85*a/(Math.PI*4),aa=a+t*9*k;const qx=k*ex+Math.cos(aa)*r2,qy=ey+Math.sin(aa)*r2;a?ctx.lineTo(qx,qy):ctx.moveTo(qx,qy);}ctx.stroke();}
    else{ctx.fillStyle='#14122b';ctx.beginPath();ctx.arc(k*ex+f*er*.3,ey-er*.3,er*.55,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(k*ex+f*er*.3-er*.18,ey-er*.5,er*.17,0,7);ctx.fill();}
  }
  // eyebrows, worried when hurt
  const hurt=S.hit>0||sz;ctx.strokeStyle='#3a2a1e';ctx.lineWidth=2.4*s;ctx.lineCap='round';ctx.beginPath();
  for(const k of[-1,1]){ctx.moveTo(k*ex-k*er*1.05,ey-er*1.75+(hurt?er*.35:0));ctx.lineTo(k*ex+k*er*1.05,ey-er*1.75-(hurt?er*.35:0));}
  ctx.stroke();
  // nose
  ctx.strokeStyle=skinDark;ctx.lineWidth=2*s;ctx.beginPath();ctx.moveTo(0,hy+R*.02);ctx.quadraticCurveTo(R*.12,hy+R*.24,-R*.02,hy+R*.28);ctx.stroke();
  // cheeks
  const puff=S.mouth>.2?1.35:1;ctx.fillStyle='#ff8f8f55';
  ctx.beginPath();ctx.arc(-R*.58,hy+R*.32,R*.16*puff,0,7);ctx.arc(R*.58,hy+R*.32,R*.16*puff,0,7);ctx.fill();
  // mouth: closed most of the time, opens wide to swallow
  const my=hy+R*.52,m=S.mouth;
  if(m<.08){
    ctx.strokeStyle='#8a4a2a';ctx.lineWidth=2.2*s;ctx.beginPath();
    if(hurt)ctx.arc(0,my+R*.14,R*.2,Math.PI*1.15,Math.PI*1.85);else ctx.arc(0,my-R*.12,R*.22,Math.PI*.2,Math.PI*.8);
    ctx.stroke();
  }else{
    const mrx=R*(.22+.16*m),mry=R*.3*m;
    ctx.fillStyle='#b8435a';ctx.beginPath();ctx.ellipse(0,my,mrx+2*s,mry+2*s,0,0,7);ctx.fill();
    ctx.fillStyle='#3a0b1c';ctx.beginPath();ctx.ellipse(0,my,mrx,mry,0,0,7);ctx.fill();
    ctx.save();ctx.beginPath();ctx.ellipse(0,my,mrx,mry,0,0,7);ctx.clip();
    ctx.fillStyle='#ff7d90';ctx.beginPath();ctx.ellipse(0,my+mry*.75,mrx*.7,mry*.55,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(-mrx*.65,my-mry,mrx*1.3,mry*.32);ctx.restore();
  }
  ctx.restore();
}
})();
